<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plagiarism Checker</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        display: grid;
        grid-template-columns: 55% 45%;
        padding: 40px 60px;
        gap: 30px;
        height: calc(100vh - 70px); /* Remove navbar height */
        overflow: hidden;
      }

      /* Adjust padding on body since now it's inside container */
      body {
        font-family: "Outfit", sans-serif;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
        color: white;
        margin: 0;
      }

      /* ===== Navbar ===== */
      nav {
        position: fixed;
        top: 0;
        width: 100%;
        height: 70px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 50px;
        z-index: 1000;
      }

      .nav-logo {
        font-weight: 700;
        font-size: 1.4rem;
        letter-spacing: 1px;
        color: #00c6ff;
      }

      .nav-links a {
        margin-left: 30px;
        text-decoration: none;
        font-weight: 500;
        color: white;
        transition: 0.3s;
      }

      .nav-links a:hover {
        color: #00c6ff;
      }

      /* ===== Main Content ===== */
      .left-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        animation: slideInLeft 1s ease-out;
      }

      .left-panel h1 {
        font-size: 3rem;
        line-height: 1.2;
        margin-bottom: 20px;
        background: linear-gradient(to right, #00c6ff, #0072ff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .left-panel p {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.8);
        max-width: 600px;
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        animation: slideInRight 1s ease-out;
      }

      .right-panel form {
        display: flex;
        flex-direction: column;
      }

      textarea {
        background: rgba(255, 255, 255, 0.05);
        color: white;
        border: none;
        padding: 20px;
        font-size: 1rem;
        border-bottom: 2px solid #00c6ff;
        resize: none;
        height: 200px;
        margin-bottom: 30px;
        outline: none;
        transition: 0.3s ease;
      }

      textarea:focus {
        border-color: #00e0ff;
        background: rgba(255, 255, 255, 0.08);
      }

      .submit-btn {
        background: linear-gradient(to right, #00c6ff, #0072ff);
        border: none;
        padding: 15px;
        color: white;
        font-size: 1.1rem;
        font-weight: bold;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 5px;
        transition: 0.3s ease;
      }

      .submit-btn:hover {
        background: linear-gradient(to right, #0072ff, #00c6ff);
        transform: scale(1.03);
      }

      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-60px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes slideInRight {
        from {
          opacity: 0;
          transform: translateX(60px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @media (max-width: 900px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto;
          padding: 120px 20px 20px 20px;
        }

        nav {
          flex-direction: column;
          height: auto;
          padding: 15px 20px;
        }

        .nav-links {
          margin-top: 10px;
        }

        .nav-links a {
          margin: 0 10px;
        }

        .left-panel,
        .right-panel {
          padding: 0;
          text-align: center;
          align-items: center;
        }

        .left-panel h1 {
          font-size: 2rem;
        }

        textarea {
          height: 150px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== Navbar ===== -->
    <nav>
      <div class="nav-logo">Plagiarism Checker</div>
      <div class="nav-links">
        <a href="/about">About Us</a>
        <a href="#members">Group Members</a>
      </div>
    </nav>

    <!-- ===== Main Container (Fix) ===== -->
    <div class="container">
      <div class="left-panel">
        <h1>AI-Powered<br />Plagiarism Detection</h1>
        <p>
          Paste your content and get instant insights. This tool uses
          intelligent text comparison to find matches across large datasets.
        </p>
      </div>

      <div class="right-panel">
        <form method="post" action="/plagiarism">
          <textarea
            name="text"
            placeholder="Paste your text here..."
            required
          ></textarea>
          <input type="submit" class="submit-btn" value="Check Plagiarism" />
        </form>
      </div>
    </div>
  </body>
</html>
