<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Plagiarism Result</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #f0f0f0;
      padding-top: 90px;
      min-height: 100vh;
      animation: fadeInBody 1s ease;
    }

    @keyframes fadeInBody {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    nav {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      z-index: 10;
    }

    .nav-logo {
      color: #00c6ff;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .nav-links a {
      color: #ffffffdd;
      margin-left: 25px;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
    }

    .nav-links a:hover {
      color: #00c6ff;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .title {
      font-size: 2rem;
      text-align: center;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .topic-badge {
      background: #006784;
      color: #fff;
      font-weight: 600;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      margin: 0 auto 30px;
      text-align: center;
      font-size: 1rem;
      animation: popIn 0.6s ease;
    }

    .label {
      font-weight: 600;
      font-size: 1.1rem;
      margin-bottom: 10px;
      color: #ffffffcc;
    }

    .essay-box {
      background: rgba(255, 255, 255, 0.07);
      padding: 20px;
      border-left: 5px solid #00c6ff;
      border-radius: 10px;
      margin-bottom: 30px;
      line-height: 1.6;
      animation: fadeInBox 0.8s ease-in;
    }

    .result-box {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 20px;
      border-radius: 12px;
      border-left: 6px solid;
      animation: popIn 0.6s ease-in-out;
    }

    .result-safe {
      background-color: rgba(76, 175, 80, 0.12);
      color: #4caf50;
      border-color: #4caf50;
    }

    .result-danger {
      background-color: rgba(244, 67, 54, 0.12);
      color: #f44336;
      border-color: #f44336;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes fadeInBox {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .nav-links {
        display: flex;
        flex-direction: column;
        margin-top: 10px;
      }
      .nav-links a {
        margin: 10px 0 0;
      }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-logo">Plagiarism Checker</div>
    <div class="nav-links">
      <a href="/about">About Us</a>
      <a href="#members">Group Members</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container">
    <div class="title">Plagiarism Report</div>

    <!-- Predicted Topic -->
    <div class="topic-badge">Predicted Topic: {{ topic }}</div>

    <!-- User Essay -->
    <div class="label">Your Essay:</div>
    <div class="essay-box">{{ text }}</div>

    <!-- Score -->
    <div class="label">Plagiarism Score:</div>
    <div class="result-box {% if similarity > 50 %}result-danger{% else %}result-safe{% endif %}">
      {{ similarity }}% Plagiarized
    </div>
  </div>

</body>
</html>
